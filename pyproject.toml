[project]
name = "autoinit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "packaging>=26.3",
]

[project.scripts]
autoinit = "autoinit.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.2"
index-strategy = "first-index"
python-preference = "only-managed"
link-mode = "copy"


[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src"]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=autoinit",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "prek>=0.4.13",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
