[project]
name = "autoinit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
autoinit = "autoinit.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.2"
index-strategy = "first-index"
python-preference = "only-managed"
link-mode = "copy"

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # These rules conflict with Ruff's formatter.
    "COM812",
    "ISC001",
    "C901", "PLR0912", # Function complexity is fake news
    "RET505", # I hate this
    "CPY001", # Do not invent copyright ownership before licensing the project.

]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "FBT001", # Boolean parameters are useful in parametrized tests.
    "PLR2004", # Expected literal values make tests easier to read.
    "S101", # Pytest uses plain assert statements for rich diagnostics.
]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src"]
python-version = "3.15"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=autoinit",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "prek>=0.4.13",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
